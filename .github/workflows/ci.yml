name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -U postgres; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done


      - name: Generate Prisma client
        run: npm run generate --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcshop?schema=public

      - name: Apply migrations and seed
        run: |
          cd backend
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma db seed --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcshop?schema=public

      - run: npm run build --prefix backend
      - run: npm run build --prefix frontend

      - name: Start backend
        run: |
          npm start --prefix backend &
          timeout 30s bash -c 'until curl -s http://localhost:3000/api/health | grep -q "status"; do sleep 1; done'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pcshop?schema=public
          PORT: 3000
          NODE_ENV: test
          JWT_SECRET: testsecret
          ROLLBAR_ACCESS_TOKEN_BACKEND: dummy
          ROLLBAR_ACCESS_TOKEN_FRONTEND: dummy
          VITE_ROLLBAR_ACCESS_TOKEN_FRONTEND: dummy

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
